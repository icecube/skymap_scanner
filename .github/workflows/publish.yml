name: docker & singularity/cvmfs releases

on:
  push:
    # on push tags only
    branches-ignore:
      - '**'
    tags:
      - '**'
  workflow_dispatch:
  delete:
    branches:
      - '**'

permissions: # default for all jobs
  contents: read

jobs:
  prep:
    if: github.event_name == 'delete'   # only used when mode becomes CVMFS_REMOVE
    runs-on: ubuntu-latest
    outputs:
      remove_tags: ${{ steps.output.outputs.remove_tags }}
    steps:
      - id: output
        run: |
          set -euo pipefail
          ref="${{ github.event.ref }}"
          ref="${ref#refs/heads/}"     # strip ref prefix, just in case
          ref="${ref#refs/tags/}"
          # mirror docker/metadata-action sanitization used when the image was built:
          # replace invalid tag chars (e.g. '/' in branch names) with '-'
          sanitized="$(printf '%s' "$ref" | sed -E 's#[^a-zA-Z0-9._-]+#-#g')"
          if [[ "${{ github.event.ref_type }}" == "tag" ]]; then
            # release images are persisted verbatim on CVMFS (e.g. ...:v1.2.3);
            # keep the -[SHA] variant too in case a branch-style image exists
            printf '%s\n' "$sanitized" "$sanitized-[SHA]"
          else
            # branch images are persisted as <sanitized-branch>-<shortsha>
            printf '%s\n' "$sanitized-[SHA]"
          fi > tags.txt
          {
            echo "remove_tags<<EOF"
            cat tags.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  image-publish:
    needs: [ prep ]
    uses: WIPACrepo/wipac-dev-workflows/.github/workflows/image-publish.yml@v1.33
    permissions: # for GITHUB_TOKEN
      contents: read
      packages: write
    with:
      image_registry: docker.io
      image_namespace: icecube
      image_name: skymap_scanner
      mode: ${{ github.event_name == 'delete' && 'CVMFS_REMOVE' || 'CVMFS_BUILD' }}
      cvmfs_dest_dir: realtime
      # only used if mode is CVMFS_REMOVE:
      cvmfs_remove_tags: ${{ needs.prep.outputs.remove_tags }}
      # only used if mode builds image:
      free_disk_space: true
      build_platforms_csv: 'linux/amd64'
    secrets:
      registry_username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry_token: ${{ secrets.DOCKERHUB_TOKEN }}
      cvmfs_github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
